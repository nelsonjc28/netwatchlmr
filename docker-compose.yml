version: '3.9'

services:
  netwatch-lmr:
    build:
      context: .
    container_name: netwatch-lmr
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      NETWATCH_SECRET_KEY: ${NETWATCH_SECRET_KEY:?Define NETWATCH_SECRET_KEY before starting}
    volumes:
      - .:/app
